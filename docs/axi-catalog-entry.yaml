- name: llm-semantic-axi
  url: https://github.com/samestrin/llm-semantic-axi
  author: samestrin
  domain: Semantic code search
  description: "Semantic code search over a local embedding index, with `callers` and `refs` call-edge lookup for Go, JavaScript, TypeScript, Python and Rust."
  admission:
    status: exception
    reviewed_revision: 4b00b830526f3fb0cc0becc27e69af8e10c2df63
    reviewed_components:
      - README.md
      - docs/axi-conformance.md
      - benchmarks/results-tokens.md
      - cmd/llm-semantic/main.go
      - pkg/output/axi.go
      - pkg/output/exit.go
      - pkg/output/formatter.go
      - internal/semantic/commands/root.go
      - internal/semantic/commands/search.go
      - internal/semantic/commands/refs.go
      - internal/semantic/commands/setup.go
      - internal/semantic/commands/collection.go
      - internal/semantic/commands/memory.go
      - internal/semantic/mcpserver/handlers.go
      - internal/semantic/refs_go.go
      - internal/semantic/treesitter/refs_javascript.go
      - internal/semantic/treesitter/chunker_python.go
      - internal/semantic/treesitter/chunker_rust.go
    source_observations:
      - "TOON is opt-in: --axi is a persistent flag that defaults to false (internal/semantic/commands/root.go), so a plain `llm-semantic` run prints human-readable text. The MCP server appends --axi to every CLI call (internal/semantic/mcpserver/handlers.go), and TOON is encoded through go-axi (pkg/output/axi.go)."
      - "In --axi, a search row carries four fields (file as path:line, name, score, content), and content over 200 characters is cut with a note of how many characters were left out and --full for the rest (internal/semantic/commands/search.go, axiSearchRows and axiCut)."
      - "In --axi, a search result list states its total, and an empty answer carries status index_empty when the index has no chunks or no_match otherwise (search.go, axiResultList and markZeroResults). callers and refs say 'not indexed for edges' instead of returning a bare empty list (internal/semantic/commands/refs.go)."
      - "Errors: in plain mode the error goes to stderr (pkg/output/formatter.go, PrintError); under --json and --axi it is an `error: true` object on stdout. Usage errors exit 2 and name the bad flag or command with the valid choices; other failures exit 1 (pkg/output/exit.go). Output of `llm-semantic --bogus` and `llm-semantic index-status >/dev/null` in an empty directory shows both."
      - "No command prompts: collection delete without --force and memory stats --prune without --yes refuse with an error naming the flag and exit 1 (internal/semantic/commands/collection.go, memory.go)."
      - "setup writes a SessionStart hook into .claude/settings.json and an Agent Skill into .claude/skills/llm-semantic/, nothing else (internal/semantic/commands/setup.go; `llm-semantic setup --dry-run` lists the two files). It writes no session-end hook and nothing for agents other than Claude Code."
      - "A bare `llm-semantic` run shows live data: the executable path and the index status of the current directory; unindexed, it prints status not_indexed with `llm-semantic index .` as the next step and exits 0 (internal/semantic/commands/root.go)."
      - "--json keeps its pre-AXI schema so existing scripts keep working: a bare result array with full, untruncated fields and no total, status or help (search.go, outputJSON)."
      - "Only the Go, JavaScript, TypeScript, Python and Rust chunkers implement ExtractRefs (internal/semantic/refs_go.go, treesitter/refs_javascript.go, treesitter/chunker_python.go, treesitter/chunker_rust.go), so callers and refs have call edges for those five languages only."
      - "benchmarks/results-tokens.md, re-checked by `make bench-tokens`: over 10 searches of this repository, --axi printed 11,020 cl100k tokens and --json 38,831 (28.4%). The embeddings were an offline stand-in, so only the comparison between renderings is meaningful."
    exception: "TOON is opt-in through --axi and is not the default output; the default is plain text (principle 1). Plain-mode errors go to stderr, not stdout (principle 6); exit code 2 for usage errors follows the spec. setup targets Claude Code only and writes no session-end hook (principle 7). --json keeps its pre-AXI schema (no truncation, total, status or help), so principles 2-5 are met in --axi but not in --json. callers and refs have call edges for Go, JavaScript, TypeScript, Python and Rust only; in other languages they report 'not indexed for edges'."
