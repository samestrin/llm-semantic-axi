#
# This file is a draft, not a submission. Nothing here has been sent to
# kunchenguid/axi. The owner submits it (the PR is public).
#
# Steps the owner runs:
#   1. Fork kunchenguid/axi and branch from its main.
#   2. Append the `- name: llm-semantic-axi` entry below (without these comments)
#      to the `community` list in catalog.yaml.
#   3. Confirm `reviewed_revision` still equals `git rev-parse v1.2.0^{commit}`
#      in this repository (see the tag-commit note below).
#   4. Run `pnpm run docs:gen` to regenerate README.md and docs/index.html, and
#      commit all three files together (CI `docs:check` fails on drift).
#   5. Push through the `no-mistakes` gate: `no-mistakes init --fork-url
#      git@github.com:<you>/axi.git`, then `git push no-mistakes`. Pushing from
#      a fork needs no-mistakes v1.30.1 or newer. It runs the pipeline and
#      opens the PR.
#
# Tag-commit note: `reviewed_revision` is the commit the `v1.2.0` tag points at
# (`git rev-parse v1.2.0^{commit}`), not a branch head. Repo PRs are
# squash-merged, so a branch commit can vanish; the tag cannot. Every
# observation below was checked against the source at that commit. To review a
# later release, re-tag, replace the SHA and re-run the checks listed here.
#
# How each source observation was checked (paths are relative to the repo
# root at the tag; `$B` is `go build -o $B ./cmd/llm-semantic`, run in an empty
# directory):
#   1. TOON opt-in: internal/semantic/commands/root.go:244 (`--axi`, default
#      false); internal/semantic/mcpserver/handlers.go:159 (MCP appends
#      `--axi`); `$B` prints plain text, `$B --axi` prints TOON.
#   2. Rows and truncation: internal/semantic/commands/search.go:337-348
#      (axiSearchRows: file, name, score, content) and search.go:324-332
#      (axiContentLimit = 200, "… (N more chars, use --full for all)").
#   3. Totals and empty states: search.go:290-296 (axiResultList carries
#      `total`), search.go:592-599 (index_empty vs no_match),
#      internal/semantic/commands/refs.go:194 ("not indexed for edges").
#   4. Errors and exit codes: pkg/output/formatter.go:380-385 (plain-mode
#      errors written to stderr), formatter.go:343-360 (`--axi` error object
#      on stdout), pkg/output/exit.go:73,76 (2 for usage errors, 1 otherwise);
#      `$B index-status >/dev/null` still prints the error (stderr) and exits
#      1; `$B --bogus` names the flag, lists the valid ones and exits 2.
#   5. No prompts: internal/semantic/commands/collection.go:82 and
#      internal/semantic/commands/memory.go:1482 (refuse without --force /
#      --yes); test TestCollectionDeleteWithoutForceRefusesAndNeverPrompts.
#   6. setup: internal/semantic/commands/setup.go:48-53 and :77-78 (SessionStart
#      hook in .claude/settings.json, skill in .claude/skills/llm-semantic/);
#      `grep -n SessionEnd internal/semantic/commands/setup.go` finds nothing;
#      `$B setup --dry-run` lists only those two files.
#   7. Bare run: internal/semantic/commands/root.go:100,113-118 (not_indexed and
#      the next step); `$B` and `$B --axi` in an empty directory exit 0 with
#      `status: not_indexed` and a `help` list.
#   8. --json schema: search.go:350-352 (outputJSON prints the bare result
#      array, no total, no help); test TestSearchJSONAndPlainHaveNoHelp.
#   9. Call-edge languages: the only ExtractRefs implementations are
#      internal/semantic/refs_go.go:14,
#      internal/semantic/treesitter/refs_javascript.go:16,22 (JavaScript,
#      TypeScript), treesitter/chunker_python.go:126 and
#      treesitter/chunker_rust.go:203 (treesitter/fallback.go:115 only
#      delegates); `grep -rn "func (.*) ExtractRefs" internal`.
#  10. Token count: `make bench-tokens` re-counts benchmarks/outputs/ and exits 1
