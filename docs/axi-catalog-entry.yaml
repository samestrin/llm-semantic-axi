      - internal/semantic/commands/index.go
      - internal/semantic/commands/index_update.go
      - internal/semantic/commands/search.go
      - internal/semantic/commands/refs.go
      - internal/semantic/commands/setup.go
      - internal/semantic/commands/collection.go
      - internal/semantic/commands/memory.go
      - internal/semantic/mcpserver/handlers.go
      - internal/semantic/refs_go.go
      - internal/semantic/treesitter/refs_javascript.go
      - internal/semantic/treesitter/chunker_python.go
      - internal/semantic/treesitter/chunker_rust.go
    source_observations:
      - "TOON is the default output: every command prints TOON unless --json or --plain replaces it (internal/semantic/commands/axi.go, resolveOutputMode). --axi is still accepted as an alias for TOON; contradictory format flags, such as --plain --json or --axi with --json or --plain, exit 2. TOON is encoded through go-axi (pkg/output/axi.go), and the MCP server runs the CLI in TOON (internal/semantic/mcpserver/handlers.go)."
      - "A default search row carries four fields (file as path:line, name, score, content), and content over 200 characters is cut with a note of how many characters were left out and --full for the rest (internal/semantic/commands/search.go, axiSearchRows and axiCut). Default callers rows carry three fields (file as path:line, name, ref) and refs rows four (file as path:line, ref, resolved, type, external references omitting file), with --full restoring every field (internal/semantic/commands/refs.go, writeCallersJSON and writeRefsJSON). memory list rows carry id, question, status and the cut answer (as does the answer memory store echoes back), and memory stats rows id, question, retrieval_count, avg_score, with --full restoring every field (internal/semantic/commands/memory.go, axiMemoryListRows and axiMemoryStatsRows)."
      - "A default search result list states its total, and an empty answer carries status index_empty when the index has no chunks or no_match otherwise (search.go, axiResultList and markZeroResults). callers and refs state their total in the default TOON output and say 'not indexed for edges' instead of returning a bare empty list (internal/semantic/commands/refs.go). memory list and memory stats state a total and carry status store_empty with a message over an empty store, no_match when a filter excludes every entry or nothing has been retrieved yet (internal/semantic/commands/memory.go, markMemoryListZeroResults and markMemoryStatsZeroResults)."
      - "Errors go to stdout in the active format: a TOON or JSON object with error: true, or `Error: ...` under --plain (pkg/output/formatter.go, PrintError); stderr carries only diagnostics. Malformed invocations exit 2: an unknown flag or command names it and lists the valid choices; a missing or extra argument, a missing required flag or a bad flag value names it and shows the right form; contradictory format flags name the conflicting flags; other failures exit 1 (pkg/output/exit.go). index and index-update exit 1 when any file failed, printing the counts and the errors list in one document with error: true (internal/semantic/commands/index.go, incompleteError). Output of `llm-semantic --bogus` and `llm-semantic index-status 2>/dev/null` in an empty directory shows both."
      - "No command prompts: collection delete without --force and memory stats --prune without --yes refuse with an error naming the flag and exit 1 (internal/semantic/commands/collection.go, memory.go)."
      - "setup registers a SessionStart hook with Claude Code (.claude/settings.json) and Codex (.codex/hooks.json, with [features] hooks = true in .codex/config.toml), and an OpenCode plugin (.opencode/plugins/llm-semantic.ts) on session.created; each runs `llm-semantic index-status || true`, so a session starts with the directory's index status. It also writes the Agent Skill to .claude/skills/llm-semantic/. --target (repeatable) narrows to the named agents; only files under the current directory are written (internal/semantic/commands/setup.go; `llm-semantic setup --dry-run` lists the five files)."
      - "A bare `llm-semantic` run shows live data: the executable path and the index status of the current directory; unindexed, it prints status not_indexed with `llm-semantic index .` as the next step and exits 0 (internal/semantic/commands/root.go)."
      - "--json keeps its pre-AXI schema so existing scripts keep working: a bare result array with full, untruncated fields and no total, status or help (search.go, outputJSON); callers and refs keep their object with count and full fields (refs.go). It is printed only when --json is passed."
      - "Only the Go, JavaScript, TypeScript, Python and Rust chunkers implement ExtractRefs (internal/semantic/refs_go.go, treesitter/refs_javascript.go, treesitter/chunker_python.go, treesitter/chunker_rust.go), so callers and refs have call edges for those five languages only."
      - "benchmarks/results-tokens.md, re-checked by `make bench-tokens`: over 10 searches of this repository, TOON printed 11,241 cl100k tokens and --json 43,477 (25.9%). The embeddings were an offline stand-in, so only the comparison between renderings is meaningful."
    exception: "--json is an opt-in compatibility mode that keeps its pre-AXI schema (no truncation, total, status or help) so existing scripts keep working; principles 2-5 are met in the default TOON output but not under --json. callers and refs have call edges for Go, JavaScript, TypeScript, Python and Rust only; in other languages they report 'not indexed for edges' rather than an empty answer. setup installs a session-start hook only and no session-end hook, so principle 7's lifecycle capture is not done: the tool keeps no session state to capture."
