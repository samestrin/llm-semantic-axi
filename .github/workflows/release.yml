name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: verify
        run: |
          test -z "$(gofmt -s -l .)"
          go vet ./...
          go test -race ./...

      - name: build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist
          CLI_LDFLAGS="-s -w -X main.version=$VERSION -X main.commit=$COMMIT"
          MCP_LDFLAGS="-s -w -X main.serverVersion=$VERSION"
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            os=${platform%/*}; arch=${platform#*/}
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -ldflags "$CLI_LDFLAGS" -o dist/llm-semantic-$os-$arch$ext ./cmd/llm-semantic
            GOOS=$os GOARCH=$arch go build -ldflags "$MCP_LDFLAGS" -o dist/llm-semantic-mcp-$os-$arch$ext ./cmd/llm-semantic-mcp
          done

      # install-release.sh downloads one archive per platform holding both
      # binaries under their installed names, and checks it against
      # SHA256SUMS.txt. The asset name here and in the installer must match;
      # install_release_test.go pins both.
      - name: package installer archives
        run: |
          VERSION="${GITHUB_REF_NAME}"
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${platform%/*}; arch=${platform#*/}
            stage="$(mktemp -d)"
            cp "dist/llm-semantic-$os-$arch" "$stage/llm-semantic"
            cp "dist/llm-semantic-mcp-$os-$arch" "$stage/llm-semantic-mcp"
            chmod 755 "$stage/llm-semantic" "$stage/llm-semantic-mcp"
            tar -czf "dist/llm-semantic-${os}-${arch}.tar.gz" -C "$stage" llm-semantic llm-semantic-mcp
            rm -rf "$stage"
          done
          # Pin the published installer to this tag, so the copy downloaded
          # from a tag URL installs that tag rather than whatever is latest.
          sed "s|^PINNED_VERSION=\"\"\$|PINNED_VERSION=\"$VERSION\"|" install-release.sh > dist/install-release.sh
          grep -qx "PINNED_VERSION=\"$VERSION\"" dist/install-release.sh
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: publish
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
